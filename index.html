<script>
(function () {
  var SALT = "togz5sJO70kMw8qeAIIe9Q==", IV = "Mvh9hD46Yoy1sGac", KEY = 'ge-act-v2-pass';
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('b');
  var gate = document.getElementById('gate'), frame = document.getElementById('frame');
  function bytes(s64) { var s = atob(s64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  async function unlock(pass) {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: 210000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var ct = bytes(document.getElementById('payload').textContent.trim());
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, ct);
    try { sessionStorage.setItem(KEY, pass); } catch (e) {}
    var url = URL.createObjectURL(new Blob([pt], { type: 'text/html' }));
    frame.src = url;
    frame.style.display = 'block';
    gate.remove();
    document.getElementById('payload').remove();
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = ''; btn.disabled = true; btn.textContent = 'Decrypting\u2026';
    unlock(document.getElementById('p').value).catch(function () {
      msg.textContent = 'wrong passphrase'; btn.disabled = false; btn.textContent = 'Unlock';
    });
  });
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved).catch(function () {});
})();
