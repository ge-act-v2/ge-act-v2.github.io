<script>
(function () {
  var SALT = "B44eeMAvcTvfm/s3CWVWkw==", IV = "/inbZ9lqLCfOwkaq", KEY = 'ge-act-v2-pass';
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('b');
  var gate = document.getElementById('gate'), frame = document.getElementById('frame');
  function bytes(s64) { var s = atob(s64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  async function unlock(pass) {
