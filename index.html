    frame.src = url;
    frame.style.display = 'block';
    gate.remove();
    document.getElementById('payload').remove();
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = ''; btn.disabled = true; btn.textContent = 'Decrypting\u2026';
    unlock(document.getElementById('p').value).catch(function () {
      msg.textContent = 'wrong passphrase'; btn.disabled = false; btn.textContent = 'Unlock';
    });
  });
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved).catch(function () {});
})();
</script>
